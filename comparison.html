<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poz Yarışması</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Bangers&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/styles.css" />
  <style>
    html, body { height: auto !important; overflow-y: auto !important; }

    .comp-lobby {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      padding: 40px 24px 60px;
      background:
        linear-gradient(rgba(249,237,91,0.18), rgba(249,237,91,0.18)),
        url("/static/squarepants.jpg") center/cover no-repeat fixed;
    }

    .comp-brand {
      font-family: "Bangers", sans-serif;
      font-size: 2.6rem;
      letter-spacing: 0.1em;
      color: var(--blue);
      text-shadow: 3px 3px 0 rgba(32,20,7,0.15);
      text-align: center;
    }

    .comp-back-link {
      align-self: flex-start;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.6;
      padding: 6px 0;
    }
    .comp-back-link:hover { opacity: 1; }

    .comp-card {
      background: rgba(249,237,91,0.94);
      border: 4px solid rgba(32,20,7,0.14);
      box-shadow: 8px 8px 0 rgba(32,20,7,0.12);
      padding: 28px 32px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-sizing: border-box;
    }

    .comp-card-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--ink);
    }

    .comp-label {
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(32,20,7,0.55);
      margin-bottom: 4px;
    }

    .comp-input {
      width: 100%;
      padding: 10px 12px;
      border: 3px solid rgba(32,20,7,0.18);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      background: #fff;
      box-sizing: border-box;
    }

    .comp-or {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(32,20,7,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .comp-error {
      font-size: 0.82rem;
      font-weight: 700;
      color: #e53636;
    }

    /* ── Open rooms list ── */
    .comp-open-rooms {
      background: rgba(249,237,91,0.94);
      border: 4px solid rgba(32,20,7,0.14);
      box-shadow: 8px 8px 0 rgba(32,20,7,0.12);
      padding: 22px 28px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-sizing: border-box;
    }

    .comp-open-rooms-empty {
      font-size: 0.82rem;
      color: rgba(32,20,7,0.45);
      font-weight: 700;
      text-align: center;
      padding: 8px 0;
    }

    .comp-open-room-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(32,20,7,0.06);
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }
    .comp-open-room-row:hover { border-color: var(--blue); }

    .comp-open-room-code {
      font-family: "Bangers", sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      color: var(--blue);
    }

    .comp-open-room-host {
      font-size: 0.82rem;
      font-weight: 800;
      color: rgba(32,20,7,0.6);
    }

    .comp-open-room-join {
      font-size: 0.72rem;
      font-weight: 900;
      color: #fff;
      background: var(--blue);
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* ── Waiting room ── */
    .comp-waiting {
      background: rgba(249,237,91,0.94);
      border: 4px solid rgba(32,20,7,0.14);
      box-shadow: 8px 8px 0 rgba(32,20,7,0.12);
      padding: 40px 36px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-sizing: border-box;
    }

    .comp-wait-icon { font-size: 3rem; }
    .comp-wait-title { font-size: 1.3rem; font-weight: 900; }
    .comp-wait-code {
      font-family: "Bangers", sans-serif;
      font-size: 3rem;
      letter-spacing: 0.18em;
      color: var(--blue);
    }
    .comp-wait-players {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .comp-player-chip {
      background: rgba(32,20,7,0.08);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 800;
    }
    .comp-player-chip.ready { background: #2eaa6e; color: #fff; }

    /* ── Game screen ── */
    .comp-game {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
    }

    .comp-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--panel-yellow);
      border-bottom: 3px solid rgba(32,20,7,0.12);
      flex-shrink: 0;
      gap: 12px;
    }

    .comp-topbar-title {
      font-family: "Bangers", sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
    }

    /* ── Arena: 3 cols ── */
    .comp-arena {
      display: grid;
      grid-template-columns: 1fr 300px 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Player panel: camera + orb track side by side ── */
    .comp-player-panel {
      display: flex;
      flex-direction: column;
      background: var(--panel-yellow);
      border-right: 3px solid rgba(32,20,7,0.10);
      overflow: hidden;
    }

    .comp-player-panel.right-panel {
      border-right: none;
      border-left: 3px solid rgba(32,20,7,0.10);
    }

    .comp-panel-header {
      padding: 10px 14px;
      border-bottom: 2px solid rgba(32,20,7,0.10);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .comp-panel-name {
      font-size: 0.85rem;
      font-weight: 900;
    }

    .comp-panel-level {
      font-family: "Bangers", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      color: var(--blue);
    }

    /* camera + orbs row */
    .comp-panel-body {
      display: flex;
      flex-direction: row;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .comp-camera-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .comp-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .comp-success-badge {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #2eaa6e;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .comp-success-badge.show { opacity: 1; }

    /* ── Orb track ── */
    .comp-orb-track {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 0;
      background: rgba(32,20,7,0.05);
      border-left: 2px solid rgba(32,20,7,0.08);
    }

    .right-panel .comp-orb-track {
      border-left: none;
      border-right: 2px solid rgba(32,20,7,0.08);
      order: -1;
    }

    .comp-orb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(32,20,7,0.12);
      border: 2px solid rgba(32,20,7,0.18);
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
    }

    .comp-orb.done {
      background: #2eaa6e;
      border-color: #1e8a56;
    }

    .comp-orb.current {
      background: var(--blue);
      border-color: #1a7acc;
      animation: orb-pulse 1s ease-in-out infinite;
    }

    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(42,130,255,0.4); }
      50% { transform: scale(1.25); box-shadow: 0 0 0 5px rgba(42,130,255,0); }
    }

    .comp-hints {
      padding: 6px 10px;
      min-height: 32px;
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: rgba(32,20,7,0.04);
      border-top: 2px solid rgba(32,20,7,0.08);
    }

    /* ── Center column ── */
    .comp-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px 12px;
      background: var(--panel-yellow);
      border-left: 3px solid rgba(32,20,7,0.10);
      border-right: 3px solid rgba(32,20,7,0.10);
    }

    .comp-target-img {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1/1;
      object-fit: contain;
      border-radius: 10px;
      border: 3px solid rgba(32,20,7,0.12);
      background: rgba(32,20,7,0.04);
    }

    .comp-level-badge {
      font-family: "Bangers", sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    /* ── Opponent camera (remote frame) ── */
    .comp-remote-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Finished ── */
    .comp-finished {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      padding: 40px 24px;
      background:
        linear-gradient(rgba(249,237,91,0.18), rgba(249,237,91,0.18)),
        url("/static/squarepants.jpg") center/cover no-repeat fixed;
    }

    .comp-finished-card {
      background: rgba(249,237,91,0.94);
      border: 4px solid rgba(32,20,7,0.14);
      box-shadow: 8px 8px 0 rgba(32,20,7,0.12);
      padding: 40px 36px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-sizing: border-box;
    }

    .comp-finished-icon { font-size: 3rem; }
    .comp-finished-title { font-size: 1.6rem; font-weight: 900; }
    .comp-finished-winner {
      font-family: "Bangers", sans-serif;
      font-size: 2.2rem;
      letter-spacing: 0.08em;
      color: var(--blue);
    }
    .comp-finished-times {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .comp-finished-time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 10px;
      background: rgba(32,20,7,0.06);
      border-radius: 6px;
    }

    @media (max-width: 700px) {
      .comp-arena { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
      .comp-player-panel { max-height: 40vh; }
      .comp-center { padding: 10px; }
      .comp-target-img { max-width: 140px; }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCx6NrESFkyL87PrdrVPxOp0OcsBlxF9ys",
  authDomain: "pose-tabu.firebaseapp.com",
  databaseURL: "https://pose-tabu-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "pose-tabu",
  storageBucket: "pose-tabu.firebasestorage.app",
  messagingSenderId: "785802091003",
  appId: "1:785802091003:web:8787bfb0f85583f4cf935e",
};

const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);

// ── Config ────────────────────────────────────────────────────────────────────
const MODEL_URL      = "https://teachablemachine.withgoogle.com/models/nlN9VfXC7/";
const LABELS         = ["angry","bıkmış","boring","magara_adami","merhaba","ne_diyosun_be","ordek","perfect","rainbow","scream","sus"];
const TOTAL_LEVELS   = 10;
const MATCH_THRESHOLD = 0.75;
const HOLD_FRAMES    = 4;
const FRAME_INTERVAL = 800;
const STALE_MS       = 90000;

// ── State ─────────────────────────────────────────────────────────────────────
let myId     = sessionStorage.getItem("compPlayerId") || ("c_" + Math.random().toString(36).slice(2, 10));
sessionStorage.setItem("compPlayerId", myId);

let roomCode   = null;
let roomRef    = null;
let myRef      = null;
let isHost     = false;
let queue      = [];
let myLevel    = 0;
let holdFrames = 0;
let isTransitioning = false;
let model      = null;
let webcam     = null;
let loopOn     = false;
let heartbeatTimer = null;
let frameTimer     = null;
let openRoomsUnsub = null;

// ── Seeded shuffle ────────────────────────────────────────────────────────────
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, TOTAL_LEVELS);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function randomCode() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
function photoPath(label) { return "photos/" + label + ".png"; }

function show(id, displayType) {
  ["lobbyScreen","waitingScreen","gameScreen","finishedScreen"].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = "none";
  });
  document.getElementById(id).style.display = displayType || "flex";
}

// ── Open rooms listener ───────────────────────────────────────────────────────
function listenOpenRooms() {
  const roomsRef = ref(db, "comp_rooms");
  openRoomsUnsub = onValue(roomsRef, snap => {
    const section = document.getElementById("openRoomsSection");
    const list    = document.getElementById("openRoomsList");

    if (!snap.exists()) {
      section.style.display = "none";
      return;
    }

    const now   = Date.now();
    const rooms = snap.val();
    const open  = [];

    Object.entries(rooms).forEach(([code, room]) => {
      if (room.status !== "waiting") return;
      const lastSeen = room.last_seen || room.created_at || 0;
      if (now - lastSeen > STALE_MS) return;
      const players  = room.players || {};
      const ids      = Object.keys(players);
      if (ids.length >= 2) return;
      open.push({ code, room, hostName: players[ids[0]]?.name || "?" });
    });

    section.style.display = open.length > 0 ? "flex" : "none";

    if (open.length === 0) {
      list.innerHTML = '<div class="comp-open-rooms-empty">Açık oda yok</div>';
      return;
    }

    list.innerHTML = open.map(({ code, hostName }) => `
      <div class="comp-open-room-row" data-code="${code}">
        <span class="comp-open-room-code">${code}</span>
        <span class="comp-open-room-host">${hostName}</span>
        <span class="comp-open-room-join">Katıl</span>
      </div>
    `).join("");

    list.querySelectorAll(".comp-open-room-row").forEach(row => {
      row.addEventListener("click", () => {
        const code = row.dataset.code;
        document.getElementById("joinCode").value = code;
        document.getElementById("joinCode").scrollIntoView({ behavior: "smooth" });
        document.getElementById("joinName").focus();
      });
    });
  });
}

// ── Lobby ─────────────────────────────────────────────────────────────────────
document.getElementById("createBtn").addEventListener("click", async () => {
  const name = document.getElementById("createName").value.trim();
  if (!name) { alert("Adını gir."); return; }

  if (openRoomsUnsub) openRoomsUnsub();

  const code = randomCode();
  roomCode   = code;
  isHost     = true;
  roomRef    = ref(db, "comp_rooms/" + code);
  myRef      = ref(db, "comp_rooms/" + code + "/players/" + myId);

  await set(roomRef, {
    status: "waiting",
    seed: Math.floor(Math.random() * 1000000),
    created_at: Date.now(),
    last_seen: Date.now(),
    players: { [myId]: { name, level: 0, finished_at: null } },
  });

  onDisconnect(myRef).remove();
  startHeartbeat();
  enterWaiting(code, name);
});

document.getElementById("joinBtn").addEventListener("click", async () => {
  const name  = document.getElementById("joinName").value.trim();
  const code  = document.getElementById("joinCode").value.trim().toUpperCase();
  const errEl = document.getElementById("joinError");
  errEl.style.display = "none";

  if (!name) { errEl.textContent = "Adını gir."; errEl.style.display = "block"; return; }
  if (code.length < 4) { errEl.textContent = "Geçersiz kod."; errEl.style.display = "block"; return; }

  const snap = await get(ref(db, "comp_rooms/" + code));
  if (!snap.exists()) { errEl.textContent = "Oda bulunamadı."; errEl.style.display = "block"; return; }
  const room = snap.val();
  if (room.status !== "waiting") { errEl.textContent = "Oda dolu veya oyun başladı."; errEl.style.display = "block"; return; }
  if (room.players && Object.keys(room.players).length >= 2) { errEl.textContent = "Oda dolu."; errEl.style.display = "block"; return; }

  if (openRoomsUnsub) openRoomsUnsub();

  roomCode = code;
  isHost   = false;
  roomRef  = ref(db, "comp_rooms/" + code);
  myRef    = ref(db, "comp_rooms/" + code + "/players/" + myId);

  await update(ref(db, "comp_rooms/" + code + "/players"), {
    [myId]: { name, level: 0, finished_at: null }
  });

  onDisconnect(myRef).remove();
  startHeartbeat();
  enterWaiting(code, name);
});

document.getElementById("joinCode").addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase();
});

// ── Waiting room ──────────────────────────────────────────────────────────────
function enterWaiting(code, name) {
  show("waitingScreen", "flex");
  document.getElementById("waitCode").textContent = code;

  onValue(roomRef, snap => {
    if (!snap.exists()) {
      show("lobbyScreen", "flex");
      listenOpenRooms();
      return;
    }
    const room    = snap.val();
    const players = room.players || {};
    const ids     = Object.keys(players);

    document.getElementById("waitPlayers").innerHTML = ids.map(id =>
      `<span class="comp-player-chip ready">${players[id].name}</span>`
    ).join("");

    if (ids.length === 2 && room.status === "waiting") {
      if (isHost) {
        update(roomRef, { status: "playing" });
      }
    }

    if (room.status === "playing") {
      startGame(room, name);
    }
  });
}

// ── Game start ────────────────────────────────────────────────────────────────
async function startGame(room, myName) {
  const players = room.players || {};
  const ids     = Object.keys(players);
  const oppId   = ids.find(id => id !== myId);
  const oppName = players[oppId]?.name || "Rakip";

  queue = seededShuffle(LABELS, room.seed);

  document.getElementById("myName").textContent  = myName || players[myId]?.name || "Sen";
  document.getElementById("oppName").textContent = oppName;
  document.getElementById("topRoomCode").textContent = roomCode;

  show("gameScreen", "flex");
  document.getElementById("gameScreen").style.display = "flex";

  updateMyLevel(0);
  renderOrbs("myOrbTrack", 0);
  renderOrbs("oppOrbTrack", 0);

  onValue(roomRef, snap => {
    if (!snap.exists()) return;
    const r  = snap.val();
    const ps = r.players || {};

    updateOppDisplay(ps[oppId]);

    if (r.status === "finished") {
      endGame(r);
    }
  });

  await loadModel();
  await startWebcam();
  loopOn = true;
  gameLoop(oppId);

  frameTimer = setInterval(() => uploadFrame(), FRAME_INTERVAL);
}

function updateMyLevel(level) {
  myLevel = level;
  const label = queue[level] || "";
  document.getElementById("targetImg").src          = photoPath(label);
  document.getElementById("centerLevel").textContent = "Seviye " + (level + 1);
  document.getElementById("myLevelBadge").textContent = (level + 1) + " / " + TOTAL_LEVELS;
  renderOrbs("myOrbTrack", level);
}

function updateOppDisplay(opp) {
  if (!opp) return;
  const level = opp.level || 0;
  document.getElementById("oppLevelBadge").textContent = (level + 1) + " / " + TOTAL_LEVELS;
  renderOrbs("oppOrbTrack", level);
  if (opp.frame) {
    document.getElementById("oppCanvas").src = opp.frame;
  }
  const hint = opp.hint || "";
  document.getElementById("oppHints").innerHTML = hint
    ? '<span class="hint-chip">' + hint + '</span>' : "";
}

// ── Orb rendering ─────────────────────────────────────────────────────────────
function renderOrbs(trackId, currentLevel) {
  const track = document.getElementById(trackId);
  let html = "";
  for (let i = 0; i < TOTAL_LEVELS; i++) {
    let cls = "comp-orb";
    if (i < currentLevel) cls += " done";
    else if (i === currentLevel) cls += " current";
    html += `<div class="${cls}"></div>`;
  }
  track.innerHTML = html;
}

// ── Model + Webcam ────────────────────────────────────────────────────────────
async function loadModel() {
  model = await tmPose.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
}

async function startWebcam() {
  webcam = new tmPose.Webcam(480, 360, true);
  await webcam.setup();
  await webcam.play();

  // Replace placeholder canvas with webcam's own canvas to avoid black frames
  const placeholder = document.getElementById("myCanvas");
  webcam.canvas.className = placeholder.className;
  webcam.canvas.id = "myCanvas";
  placeholder.parentNode.replaceChild(webcam.canvas, placeholder);
}

async function gameLoop(oppId) {
  if (!loopOn) return;
  webcam.update();
  await predict();
  requestAnimationFrame(() => gameLoop(oppId));
}

async function predict() {
  if (!model || !webcam || isTransitioning) return;

  const { posenetOutput } = await model.estimatePose(webcam.canvas);
  const predictions = await model.predict(posenetOutput);
  predictions.sort((a, b) => b.probability - a.probability);

  const top      = predictions[0];
  const topLabel = top?.className || "—";
  const topProb  = top?.probability || 0;
  const matched  = topProb >= MATCH_THRESHOLD;

  const name = topLabel.replace(/_/g, " ");
  const hint = matched
    ? name + " — pozu koru!"
    : "En yakın: " + name + " (" + (topProb * 100).toFixed(0) + "%)";

  document.getElementById("myHints").innerHTML = '<span class="hint-chip">' + hint + "</span>";

  update(ref(db, "comp_rooms/" + roomCode + "/players/" + myId), { hint });

  const target    = queue[myLevel];
  const targetHit = predictions.find(p => p.className === target)?.probability >= MATCH_THRESHOLD;
  holdFrames = targetHit ? holdFrames + 1 : 0;

  const badge = document.getElementById("mySuccessBadge");
  badge.classList.toggle("show", holdFrames >= HOLD_FRAMES);

  if (holdFrames >= HOLD_FRAMES && !isTransitioning) {
    isTransitioning = true;
    holdFrames = 0;
    setTimeout(() => advanceLevel(), 700);
  }
}

async function advanceLevel() {
  document.getElementById("mySuccessBadge").classList.remove("show");
  const nextLevel = myLevel + 1;

  if (nextLevel >= TOTAL_LEVELS) {
    const now = Date.now();
    await update(ref(db, "comp_rooms/" + roomCode + "/players/" + myId), {
      level: nextLevel,
      finished_at: now,
    });
    await update(roomRef, { status: "finished", winner: myId, finished_at: now });
  } else {
    await update(ref(db, "comp_rooms/" + roomCode + "/players/" + myId), { level: nextLevel });
    updateMyLevel(nextLevel);
  }
  isTransitioning = false;
}

// ── Frame upload ──────────────────────────────────────────────────────────────
function uploadFrame() {
  if (!webcam) return;
  try {
    const tmp = document.createElement("canvas");
    tmp.width = 160; tmp.height = 120;
    tmp.getContext("2d").drawImage(webcam.canvas, 0, 0, 160, 120);
    const b64 = tmp.toDataURL("image/jpeg", 0.4);
    update(ref(db, "comp_rooms/" + roomCode + "/players/" + myId), { frame: b64 });
  } catch(e) {}
}

// ── Heartbeat ─────────────────────────────────────────────────────────────────
function startHeartbeat() {
  const hb = () => { if (roomRef) update(roomRef, { last_seen: Date.now() }).catch(() => {}); };
  hb();
  heartbeatTimer = setInterval(hb, 20000);
}

// ── End game ──────────────────────────────────────────────────────────────────
function endGame(room) {
  loopOn = false;
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (frameTimer)     clearInterval(frameTimer);

  const players = room.players || {};
  const ids     = Object.keys(players);
  const winner  = room.winner;
  const isMe    = winner === myId;

  document.getElementById("finIcon").textContent    = isMe ? "🏆" : "😅";
  document.getElementById("finTitle").textContent   = "Oyun Bitti!";
  document.getElementById("finWinner").textContent  = (players[winner]?.name || "?") + " kazandı!";

  document.getElementById("finTimes").innerHTML = ids.map(id => {
    const p    = players[id];
    const done = p?.finished_at;
    const time = done
      ? ((done - room.created_at) / 1000).toFixed(1) + "s"
      : p?.level + "/" + TOTAL_LEVELS + " seviyede kaldı";
    return `<div class="comp-finished-time-row"><span>${p?.name}</span><span>${time}</span></div>`;
  }).join("");

  show("finishedScreen", "flex");
}

// ── Exit ──────────────────────────────────────────────────────────────────────
document.getElementById("exitGameBtn").addEventListener("click", async e => {
  e.preventDefault();
  loopOn = false;
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (frameTimer)     clearInterval(frameTimer);
  if (myRef) await remove(myRef);
  window.location.href = "index.html";
});

// ── Init ──────────────────────────────────────────────────────────────────────
listenOpenRooms();

</script>
