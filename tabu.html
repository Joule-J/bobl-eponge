<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose Tabu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Bangers&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/styles.css" />
  <link rel="stylesheet" href="static/tabu.css" />
</head>
<body>
  <div class="tabu-lobby">

    <div class="lobby-brand">
      <span class="lobby-title">Pose Tabu</span>
      <div style="display:flex;align-items:center;gap:12px">
        <a class="lobby-back" href="index.html" data-i18n="back">← Retour</a>
        <div class="lobby-lang-toggle">
          <button class="lang-pill" data-lang="fr">FR</button>
          <button class="lang-pill" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <!-- STEP 1: Create or Join -->
    <div id="stepEntry">

      <div class="lobby-card">
        <div class="lobby-card-title" data-i18n="create_title">Créer une salle</div>
        <div class="lobby-card-desc" data-i18n="create_desc">Crée une salle et invite tes amis avec le code.</div>

        <div class="lobby-field">
          <label class="lobby-label" data-i18n="your_name">Ton nom</label>
          <input class="lobby-input" id="createName" type="text" maxlength="16" placeholder="Ex: Alice" autocomplete="off" />
        </div>

        <div class="lobby-field">
          <label class="lobby-label" data-i18n="label_category">Catégorie</label>
          <select class="lobby-select" id="createCategory">
            <option value="spongebob">Bob L'éponge</option>
            <option value="statues" data-i18n-opt="cat_statues">Statues</option>
            <option value="mix">Mix</option>
          </select>
        </div>

        <div class="lobby-field">
          <label class="lobby-label" data-i18n="label_mode">Mode de jeu</label>
          <div class="lobby-mode-toggle">
            <button class="lobby-mode-btn active" id="modeFree" data-mode="free" data-i18n="mode_free">🎮 Free Game</button>
            <button class="lobby-mode-btn" id="modeTeam" data-mode="team" data-i18n="mode_team">⚔ Équipes</button>
          </div>
        </div>

        <div class="lobby-field">
          <label class="lobby-label" data-i18n="label_levels">Nombre de poses</label>
          <select class="lobby-select" id="createLevels">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>

        <button class="btn btn-primary btn-lobby" id="createBtn" data-i18n="btn_create">Créer la salle</button>
      </div>

      <div class="lobby-or" data-i18n="or">ou</div>

      <div class="lobby-card">
        <div class="lobby-card-title" data-i18n="join_title">Rejoindre une salle</div>

        <div class="lobby-field">
          <label class="lobby-label" data-i18n="your_name">Ton nom</label>
          <input class="lobby-input" id="joinName" type="text" maxlength="16" placeholder="Ex: Bob" autocomplete="off" />
        </div>

        <div class="lobby-field">
          <label class="lobby-label" data-i18n="label_code">Code de la salle</label>
          <input class="lobby-input" id="joinCode" type="text" maxlength="6" placeholder="Ex: XK7F2M" autocomplete="off" />
        </div>

        <button class="btn btn-primary btn-lobby" id="joinBtn" data-i18n="btn_join">Rejoindre</button>
        <div class="lobby-error hidden" id="joinError"></div>
      </div>

      <!-- Open rooms list -->
      <div class="lobby-open-rooms" id="openRoomsSection" style="display:none">
        <div class="lobby-card-title" data-i18n="open_rooms_title">Salles ouvertes</div>
        <div id="openRoomsList" class="open-rooms-list"></div>
      </div>

    </div>

    <!-- STEP 2: Team lobby (shown after joining) -->
    <div id="stepLobby" class="hidden">

      <div class="lobby-waiting-room">

        <div class="lobby-room-header">
          <div class="lobby-room-code-wrap">
            <span class="lobby-room-code-label" data-i18n="room_code">Code</span>
            <span class="lobby-room-code-big" id="lobbyCode">—</span>
          </div>
          <div class="lobby-room-info">
            <span id="lobbyCategory" class="lobby-cat-badge">—</span>
          </div>
        </div>

        <!-- Free Game: single player list -->
        <div id="freeLobbyPanel" class="hidden">
          <div class="lobby-team" style="width:100%">
            <div class="lobby-team-header" style="background:rgba(31,156,255,0.12)">
              <span class="lobby-team-name" data-i18n="players_label">Joueurs</span>
              <span class="lobby-mode-badge" data-i18n="mode_free">🎮 Free Game</span>
            </div>
            <ul class="lobby-player-list" id="freePlayerList"></ul>
          </div>
        </div>

        <!-- Teams -->
        <div class="lobby-teams" id="teamLobbyPanel">
          <div class="lobby-team" id="teamAPanel">
            <div class="lobby-team-header team-a">
              <span class="lobby-team-name" data-i18n="team_a">Équipe A</span>
              <button class="btn btn-secondary lobby-join-team-btn" id="joinTeamA" data-team="A" data-i18n="btn_join_team">Rejoindre</button>
            </div>
            <ul class="lobby-player-list" id="teamAList"></ul>
          </div>

          <div class="lobby-team" id="teamBPanel">
            <div class="lobby-team-header team-b">
              <span class="lobby-team-name" data-i18n="team_b">Équipe B</span>
              <button class="btn btn-secondary lobby-join-team-btn" id="joinTeamB" data-team="B" data-i18n="btn_join_team">Rejoindre</button>
            </div>
            <ul class="lobby-player-list" id="teamBList"></ul>
          </div>
        </div>

        <div class="lobby-actions">
          <div class="lobby-ready-status" id="readyStatus"></div>
          <button class="btn btn-primary btn-lobby" id="readyBtn" data-i18n="btn_ready">✓ Prêt</button>
          <button class="btn btn-primary btn-lobby hidden" id="startGameBtn" data-i18n="btn_start">▶ Démarrer</button>
        </div>

        <div class="lobby-hint" data-i18n="lobby_hint">En attente que tous les joueurs soient prêts…</div>

      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, child, push } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCx6NrESFkyL87PrdrVPxOp0OcsBlxF9ys",
      authDomain: "pose-tabu.firebaseapp.com",
      databaseURL: "https://pose-tabu-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pose-tabu",
      storageBucket: "pose-tabu.firebasestorage.app",
      messagingSenderId: "785802091003",
      appId: "1:785802091003:web:8787bfb0f85583f4cf935e",
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    // ── i18n ──────────────────────────────────────────────────────────────────
    const T = {
      fr: {
        back: "← Retour", create_title: "Créer une salle",
        create_desc: "Crée une salle et invite tes amis avec le code.",
        your_name: "Ton nom", label_category: "Catégorie",
        label_mode: "Mode de jeu", mode_free: "🎮 Free Game", mode_team: "⚔ Équipes",
        label_levels: "Nombre de poses", btn_create: "Créer la salle",
        btn_creating: "Création…", or: "ou", join_title: "Rejoindre une salle",
        label_code: "Code de la salle", btn_join: "Rejoindre",
        err_name: "Entre ton prénom.", err_code: "Code invalide.",
        err_notfound: "Salle introuvable.", err_finished: "Partie déjà terminée.",
        err_noposes: "Pas de poses pour cette catégorie.",
        room_code: "Code", team_a: "Équipe A", team_b: "Équipe B",
        players_label: "Joueurs",
        btn_join_team: "Rejoindre", btn_ready: "✓ Prêt", btn_start: "▶ Démarrer",
        lobby_hint: "En attente que tous les joueurs soient prêts…",
        ready_count: " joueur(s) prêt(s)",
        cat_statues: "Statues", cat_spongebob: "Bob L'éponge", cat_mix: "Mix",
        need_team: "Rejoins une équipe d'abord.",
        need_players: "Il faut au moins 1 joueur par équipe.",
        need_two_players: "Il faut au moins 2 joueurs pour démarrer.",
        open_rooms_title: "Salles ouvertes",
        open_rooms_empty: "Aucune salle ouverte pour l'instant.",
        open_room_join: "Rejoindre",
        open_room_players: "joueur(s)",
        open_room_free: "Free",
        open_room_team: "Équipes",
      },
      en: {
        back: "← Back", create_title: "Create a room",
        create_desc: "Create a room and invite friends with the code.",
        your_name: "Your name", label_category: "Category",
        label_mode: "Game mode", mode_free: "🎮 Free Game", mode_team: "⚔ Teams",
        label_levels: "Number of poses", btn_create: "Create room",
        btn_creating: "Creating…", or: "or", join_title: "Join a room",
        label_code: "Room code", btn_join: "Join",
        err_name: "Enter your name.", err_code: "Invalid code.",
        err_notfound: "Room not found.", err_finished: "Game already finished.",
        err_noposes: "No poses for this category.",
        room_code: "Code", team_a: "Team A", team_b: "Team B",
        players_label: "Players",
        btn_join_team: "Join", btn_ready: "✓ Ready", btn_start: "▶ Start",
        lobby_hint: "Waiting for all players to be ready…",
        ready_count: " player(s) ready",
        cat_statues: "Statues", cat_spongebob: "Bob L'éponge", cat_mix: "Mix",
        need_team: "Join a team first.",
        need_players: "Need at least 1 player per team.",
        need_two_players: "Need at least 2 players to start.",
        open_rooms_title: "Open rooms",
        open_rooms_empty: "No open rooms right now.",
        open_room_join: "Join",
        open_room_players: "player(s)",
        open_room_free: "Free",
        open_room_team: "Teams",
      },
    };

    let lang = localStorage.getItem("poseLang") || "fr";
    function t(key) { return (T[lang] || T.fr)[key] || key; }
    function applyTranslations() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-opt]").forEach(el => { el.textContent = t(el.dataset.i18nOpt); });
      document.querySelectorAll(".lang-pill").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
    }
    document.querySelectorAll(".lang-pill").forEach(btn => {
      btn.addEventListener("click", () => { lang = btn.dataset.lang; localStorage.setItem("poseLang", lang); applyTranslations(); });
    });
    applyTranslations();

    // ── Open rooms live list ──────────────────────────────────────────────────
    function renderOpenRooms(snap) {
      const section = document.getElementById("openRoomsSection");
      const list    = document.getElementById("openRoomsList");
      if (!snap || !snap.exists()) {
        section.style.display = "block";
        list.innerHTML = `<div class="open-rooms-empty">${t("open_rooms_empty")}</div>`;
        return;
      }
      const rooms = snap.val();
      const open  = Object.entries(rooms).filter(([, r]) =>
        r.status === "lobby" || r.status === "waiting"
      );
      section.style.display = "block";
      if (open.length === 0) {
        list.innerHTML = `<div class="open-rooms-empty">${t("open_rooms_empty")}</div>`;
        return;
      }
      list.innerHTML = open.map(([code, r]) => {
        const playerCount = r.players ? Object.keys(r.players).length : 0;
        const modeLabel   = r.game_mode === "team" ? t("open_room_team") : t("open_room_free");
        const catLabel    = r.category === "spongebob" ? t("cat_spongebob") : r.category === "statues" ? t("cat_statues") : t("cat_mix");
        return `<div class="open-room-row">
          <div class="open-room-info">
            <span class="open-room-code">${code}</span>
            <span class="open-room-meta">${catLabel} · ${modeLabel} · ${playerCount} ${t("open_room_players")}</span>
          </div>
          <button class="btn btn-secondary open-room-join-btn" data-code="${code}">${t("open_room_join")}</button>
        </div>`;
      }).join("");
      list.querySelectorAll(".open-room-join-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.getElementById("joinCode").value = btn.dataset.code;
          document.getElementById("joinName").focus();
        });
      });
    }
    onValue(ref(db, "rooms"), renderOpenRooms);

    // ── State ─────────────────────────────────────────────────────────────────
    const LABELS = {
      spongebob: ["angry","bıkmış","boring","magara_adami","merhaba","ne_diyosun_be","ordek","perfect","rainbow","scream","sus"],
      statues: [],
    };

    let myPlayerId = sessionStorage.getItem("tabuPlayerId") || ("p_" + Math.random().toString(36).substring(2, 10));
    sessionStorage.setItem("tabuPlayerId", myPlayerId);
    let myTeam = null;
    let roomCode = null;
    let isHost = false;
    let roomRef = null;
    let selectedMode = "free"; // "free" | "team"

    // ── Mode toggle ───────────────────────────────────────────────────────────
    document.querySelectorAll(".lobby-mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedMode = btn.dataset.mode;
        document.querySelectorAll(".lobby-mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === selectedMode));
      });
    });

    function getQueue(category, count) {
      let pool = [];
      if (category === "spongebob") pool = LABELS.spongebob.map(l => ({ label: l, cat: "spongebob" }));
      else if (category === "statues") pool = LABELS.statues.map(l => ({ label: l, cat: "statues" }));
      else pool = [...LABELS.spongebob.map(l => ({ label: l, cat: "spongebob" })), ...LABELS.statues.map(l => ({ label: l, cat: "statues" }))];
      return pool.sort(() => Math.random() - 0.5).slice(0, Math.min(count, pool.length));
    }

    function randomCode() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

    // ── Create ────────────────────────────────────────────────────────────────
    document.getElementById("createBtn").addEventListener("click", async () => {
      const name = document.getElementById("createName").value.trim();
      if (!name) { alert(t("err_name")); return; }
      const category = document.getElementById("createCategory").value;
      const levels   = parseInt(document.getElementById("createLevels").value);
      const queue    = getQueue(category, levels);
      if (queue.length === 0) { alert(t("err_noposes")); return; }

      const btn = document.getElementById("createBtn");
      btn.textContent = t("btn_creating");
      btn.disabled = true;

      const code = randomCode();
      roomCode = code;
      isHost   = true;

      await set(ref(db, "rooms/" + code), {
        category, status: "lobby",
        game_mode: selectedMode,
        current_turn: 0, current_level: 0,
        scores: { A: 0, B: 0 },
        queue, results: [],
        host: myPlayerId,
        players: {
          [myPlayerId]: { name, team: selectedMode === "free" ? "free" : null, ready: false }
        },
        created_at: Date.now(),
      });

      btn.textContent = t("btn_create");
      btn.disabled = false;
      enterLobby(code, name);
    });

    // ── Join ──────────────────────────────────────────────────────────────────
    document.getElementById("joinBtn").addEventListener("click", async () => {
      const name = document.getElementById("joinName").value.trim();
      const code = document.getElementById("joinCode").value.trim().toUpperCase();
      const errEl = document.getElementById("joinError");
      errEl.classList.add("hidden");

      if (!name) { errEl.textContent = t("err_name"); errEl.classList.remove("hidden"); return; }
      if (code.length < 4) { errEl.textContent = t("err_code"); errEl.classList.remove("hidden"); return; }

      const snap = await get(child(ref(db), "rooms/" + code));
      if (!snap.exists()) { errEl.textContent = t("err_notfound"); errEl.classList.remove("hidden"); return; }
      if (snap.val().status === "finished") { errEl.textContent = t("err_finished"); errEl.classList.remove("hidden"); return; }

      roomCode = code;
      const roomMode = snap.val().game_mode || "free";
      await update(ref(db, "rooms/" + code + "/players/" + myPlayerId), { name, team: roomMode === "free" ? "free" : null, ready: false });
      enterLobby(code, name);
    });

    document.getElementById("joinCode").addEventListener("input", e => { e.target.value = e.target.value.toUpperCase(); });

    // ── Lobby ─────────────────────────────────────────────────────────────────
    function enterLobby(code, name) {
      document.getElementById("stepEntry").classList.add("hidden");
      document.getElementById("stepLobby").classList.remove("hidden");
      document.getElementById("lobbyCode").textContent = code;
      roomRef = ref(db, "rooms/" + code);
      listenLobby();
    }

    function listenLobby() {
      onValue(roomRef, snap => {
        if (!snap.exists()) return;
        const room = snap.val();

        // If game started, go to game page
        if (room.status === "playing") {
          window.location.href = "tabu-oyun.html?room=" + roomCode + "&player=" + myPlayerId;
          return;
        }

        // Category badge
        const catKey = "cat_" + room.category;
        document.getElementById("lobbyCategory").textContent = t(catKey);

        const gameMode = room.game_mode || "free";
        const players  = room.players || {};
        const allPlayers = Object.values(players);

        // Show correct panel
        document.getElementById("freeLobbyPanel").classList.toggle("hidden", gameMode !== "free");
        document.getElementById("teamLobbyPanel").classList.toggle("hidden", gameMode !== "team");

        if (gameMode === "free") {
          // Render single player list
          const ul = document.getElementById("freePlayerList");
          ul.innerHTML = allPlayers.length === 0
            ? '<li class="lobby-player-empty">—</li>'
            : Object.entries(players).map(([id, p]) =>
                '<li class="lobby-player-item' + (id === myPlayerId ? " is-me" : "") + '">' +
                '<span class="player-name">' + escHtml(p.name) + '</span>' +
                (p.ready ? '<span class="player-ready-dot">✓</span>' : '') +
                '</li>'
              ).join("");
        } else {
          const teamA = Object.entries(players).filter(([, p]) => p.team === "A");
          const teamB = Object.entries(players).filter(([, p]) => p.team === "B");
          renderTeam("teamAList", teamA, players);
          renderTeam("teamBList", teamB, players);
          document.querySelectorAll(".lobby-join-team-btn").forEach(btn => {
            btn.classList.toggle("active-team", btn.dataset.team === myTeam);
          });
        }

        // Ready status
        const readyCount = allPlayers.filter(p => p.ready).length;
        document.getElementById("readyStatus").textContent = readyCount + "/" + allPlayers.length + t("ready_count");

        // Start button logic
        const allReady  = allPlayers.length > 0 && allPlayers.every(p => p.ready);
        const startBtn  = document.getElementById("startGameBtn");
        if (isHost && room.host === myPlayerId) {
          if (gameMode === "free") {
            startBtn.classList.toggle("hidden", !(allReady && allPlayers.length >= 2));
          } else {
            const teamA = Object.entries(players).filter(([, p]) => p.team === "A");
            const teamB = Object.entries(players).filter(([, p]) => p.team === "B");
            startBtn.classList.toggle("hidden", !(allReady && teamA.length > 0 && teamB.length > 0));
          }
        }

        // My ready button
        const me = players[myPlayerId];
        if (me) {
          const readyBtn = document.getElementById("readyBtn");
          readyBtn.textContent = me.ready ? "✓ " + (lang === "fr" ? "Prêt !" : "Ready!") : t("btn_ready");
          readyBtn.style.opacity = me.ready ? "0.6" : "1";
          myTeam = me.team;
        }
      });
    }

    function renderTeam(listId, members, allPlayers) {
      const ul = document.getElementById(listId);
      ul.innerHTML = members.length === 0
        ? '<li class="lobby-player-empty">—</li>'
        : members.map(([id, p]) =>
            '<li class="lobby-player-item' + (id === myPlayerId ? " is-me" : "") + '">' +
            '<span class="player-name">' + escHtml(p.name) + '</span>' +
            (p.ready ? '<span class="player-ready-dot">✓</span>' : '') +
            '</li>'
          ).join("");
    }

    function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    // Join team buttons
    document.querySelectorAll(".lobby-join-team-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!roomCode) return;
        const team = btn.dataset.team;
        myTeam = team;
        await update(ref(db, "rooms/" + roomCode + "/players/" + myPlayerId), { team, ready: false });
      });
    });

    // Ready button
    document.getElementById("readyBtn").addEventListener("click", async () => {
      if (!roomCode) return;
      const roomSnap = await get(ref(db, "rooms/" + roomCode));
      const gameMode = roomSnap.val().game_mode || "free";
      if (gameMode === "team" && !myTeam) { alert(t("need_team")); return; }
      const snap = await get(ref(db, "rooms/" + roomCode + "/players/" + myPlayerId));
      const cur  = snap.val();
      await update(ref(db, "rooms/" + roomCode + "/players/" + myPlayerId), { ready: !cur.ready });
    });

    // Start game (host only)
    document.getElementById("startGameBtn").addEventListener("click", async () => {
      if (!roomCode) return;
      const snap    = await get(ref(db, "rooms/" + roomCode));
      const room    = snap.val();
      const players = room.players || {};
      const gameMode = room.game_mode || "free";

      if (gameMode === "free") {
        const allIds = Object.keys(players);
        if (allIds.length < 2) { alert(t("need_two_players")); return; }
        // In free mode: treat all players as one pool, rotate announcer/guesser
        const firstRoles = buildFreeRoles(allIds, 0, {});
        await update(ref(db, "rooms/" + roomCode), {
          status: "playing",
          current_turn: 0, current_level: 0,
          turn_history: {},
          teams: { free: allIds },
          current_roles: firstRoles,
          wrong_requests: {},
        });
      } else {
        const teamA = Object.entries(players).filter(([, p]) => p.team === "A").map(([id]) => id);
        const teamB = Object.entries(players).filter(([, p]) => p.team === "B").map(([id]) => id);
        if (teamA.length === 0 || teamB.length === 0) { alert(t("need_players")); return; }
        const firstTurn = buildTurn(teamA, teamB, 0, {});
        await update(ref(db, "rooms/" + roomCode), {
          status: "playing",
          current_turn: 0, current_level: 0,
          turn_history: {},
          team_order: ["A", "B"],
          teams: { A: teamA, B: teamB },
          current_roles: firstTurn,
          wrong_requests: {},
        });
      }
    });

    // ── Free mode role builder ────────────────────────────────────────────────
    function buildFreeRoles(allIds, turnIndex, history) {
      const announcer = pickRotating(allIds, "announcer_free", turnIndex, history);
      const remaining = allIds.filter(id => id !== announcer);
      const guesser   = pickRotating(remaining.length > 0 ? remaining : allIds, "guesser_free", turnIndex, history);
      return { announcer, guesser, announcing_team: "free", guessing_team: "free" };
    }

    // ── Turn builder (exported so tabu-oyun can reuse via Firebase) ───────────
    function buildTurn(teamA, teamB, turnIndex, turnHistory) {
      // Which team announces this turn?
      const announcingTeam = turnIndex % 2 === 0 ? "A" : "B";
      const guessingTeam   = announcingTeam === "A" ? "B" : "A";
      const annTeam = announcingTeam === "A" ? teamA : teamB;
      const gueTeam = announcingTeam === "A" ? teamB : teamA;

      const announcer = pickRotating(annTeam, "announcer_" + announcingTeam, turnIndex, turnHistory);
      const guesser   = pickRotating(gueTeam, "guesser_"   + guessingTeam,  turnIndex, turnHistory);

      return { announcer, guesser, announcing_team: announcingTeam, guessing_team: guessingTeam };
    }

    function pickRotating(team, roleKey, turnIndex, history) {
      if (team.length === 0) return null;
      if (team.length === 1) return team[0];
      // Find who has done this role least recently
      const counts = {};
      team.forEach(id => { counts[id] = 0; });
      Object.values(history).forEach(turn => {
        if (turn[roleKey] && counts[turn[roleKey]] !== undefined) counts[turn[roleKey]]++;
      });
      const minCount = Math.min(...Object.values(counts));
      const eligible = team.filter(id => counts[id] === minCount);
      return eligible[Math.floor(Math.random() * eligible.length)];
    }
  </script>
