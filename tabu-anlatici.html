<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose Tabu — Annonciateur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Bangers&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/styles.css" />
  <link rel="stylesheet" href="static/tabu.css" />
</head>
<body>
  <div class="app-body">

    <div class="topbar">
      <div class="topbar-modes">
        <span class="tabu-role-badge anlatici" id="roleLabel">👁 Annonciateur</span>
      </div>
      <div class="topbar-brand">
        <span class="topbar-title">Pose Tabu</span>
      </div>
      <div class="topbar-controls" style="display:flex;align-items:center;gap:12px">
        <div class="lobby-lang-toggle">
          <button class="lang-pill" data-lang="fr">FR</button>
          <button class="lang-pill" data-lang="en">EN</button>
        </div>
        <span class="tabu-room-code" id="roomCodeDisplay">—</span>
      </div>
    </div>

    <div class="screens">

      <!-- WAITING for guesser -->
      <section id="waitingScreen" class="tabu-full-screen">
        <div class="tabu-wait-card">
          <div class="tabu-wait-icon">⏳</div>
          <div class="tabu-wait-title" data-i18n="wait_title">En attente du Devineur…</div>
          <div class="tabu-wait-desc" data-i18n="wait_desc">Partage ce code avec ton partenaire :</div>
          <div class="tabu-code-big" id="waitCode">—</div>
          <div class="tabu-wait-desc" style="font-size:0.8rem;opacity:0.6">URL : <span id="waitUrl"></span></div>
        </div>
      </section>

      <!-- PLAYING -->
      <section id="playScreen" class="screen" style="display:none">

        <!-- Target image -->
        <div class="stage">
          <div class="stage-header">
            <div class="stage-meta">
              <span class="stage-eyebrow" data-i18n="eyebrow_target">Pose cible</span>
              <span class="stage-title" id="anlaticiLevelTitle">Niveau 1</span>
            </div>
            <div class="level-indicator">
              <div class="guess-progress" id="anlaticiProgress"></div>
              <button class="btn btn-secondary" id="skipAnlatici" data-i18n="btn_skip">Passer</button>
            </div>
          </div>
          <div class="meme-wrap">
            <img id="anlaticiTargetImage" alt="" />
            <div class="meme-label-bar" id="anlaticiLabelBar" style="display:none">
              <span class="meme-name" id="anlaticiMemeLabel">—</span>
              <span class="meme-tag" id="anlaticiCatTag">—</span>
            </div>
          </div>
        </div>

        <!-- Score / status panel -->
        <div class="stage">
          <div class="stage-header">
            <div class="stage-meta">
              <span class="stage-eyebrow" data-i18n="eyebrow_dashboard">Tableau de bord</span>
              <span class="stage-title" data-i18n="title_progress">Progression</span>
            </div>
          </div>
          <div class="tabu-score-panel">
            <div class="tabu-score-block">
              <span class="tabu-score-num" id="anlaticiScore">0</span>
              <span class="tabu-score-label" data-i18n="label_score">Score</span>
            </div>
            <div class="tabu-score-block">
              <span class="tabu-score-num" id="anlaticiLevelNum">1</span>
              <span class="tabu-score-label" data-i18n="label_level">Niveau</span>
            </div>
            <div class="tabu-score-block">
              <span class="tabu-score-num" id="anlaticiTotal">—</span>
              <span class="tabu-score-label" data-i18n="label_total">Total</span>
            </div>
          </div>
          <div class="tabu-status-bar" id="anlaticiStatus" data-i18n="status_waiting">
            En attente de la pose…
          </div>
        </div>

      </section>

      <!-- FINISHED -->
      <section id="finishedScreen" class="tabu-full-screen" style="display:none">
        <div class="tabu-wait-card">
          <div class="tabu-wait-icon">🎉</div>
          <div class="tabu-wait-title" data-i18n="finished_title">Partie terminée !</div>
          <div class="tabu-final-score">
            <span id="finalScore">0</span><span class="tabu-final-total" id="finalTotal">/10</span>
          </div>
          <div class="results-dots" id="anlaticiDots"></div>
          <a class="btn btn-primary results-restart" href="tabu.html" data-i18n="btn_newgame">↺ Nouvelle partie</a>
        </div>
      </section>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCx6NrESFkyL87PrdrVPxOp0OcsBlxF9ys",
      authDomain: "pose-tabu.firebaseapp.com",
      databaseURL: "https://pose-tabu-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "pose-tabu",
      storageBucket: "pose-tabu.firebasestorage.app",
      messagingSenderId: "785802091003",
      appId: "1:785802091003:web:8787bfb0f85583f4cf935e",
    };

    const app    = initializeApp(firebaseConfig);
    const db     = getDatabase(app);
    const params = new URLSearchParams(window.location.search);
    const ROOM   = params.get("room");

    // ── i18n ─────────────────────────────────────────────────────────────────
    const T = {
      fr: {
        role:              "👁 Annonciateur",
        wait_title:        "En attente du Devineur…",
        wait_desc:         "Partage ce code avec ton partenaire :",
        eyebrow_target:    "Pose cible",
        btn_skip:          "Passer",
        eyebrow_dashboard: "Tableau de bord",
        title_progress:    "Progression",
        label_score:       "Score",
        label_level:       "Niveau",
        label_total:       "Total",
        status_waiting:    "En attente de la pose…",
        status_matched:    "✓ Pose réussie !",
        status_trying:     "⏱ En train d'essayer…",
        finished_title:    "Partie terminée !",
        btn_newgame:       "↺ Nouvelle partie",
        level_prefix:      "Niveau ",
        cat_statues:       "Statues",
      },
      en: {
        role:              "👁 Announcer",
        wait_title:        "Waiting for the Guesser…",
        wait_desc:         "Share this code with your partner:",
        eyebrow_target:    "Target pose",
        btn_skip:          "Skip",
        eyebrow_dashboard: "Dashboard",
        title_progress:    "Progress",
        label_score:       "Score",
        label_level:       "Level",
        label_total:       "Total",
        status_waiting:    "Waiting for a pose…",
        status_matched:    "✓ Pose matched!",
        status_trying:     "⏱ Trying…",
        finished_title:    "Game over!",
        btn_newgame:       "↺ New game",
        level_prefix:      "Level ",
        cat_statues:       "Statues",
      },
    };

    let lang = localStorage.getItem("poseLang") || "fr";

    function t(key) { return (T[lang] || T.fr)[key] || key; }

    function applyTranslations() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll(".lang-pill").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
      });
    }

    document.querySelectorAll(".lang-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        localStorage.setItem("poseLang", lang);
        applyTranslations();
      });
    });

    applyTranslations();

    if (!ROOM) { window.location.href = "tabu.html"; }

    const roomRef = ref(db, "rooms/" + ROOM);

    function photoPath(cat, label) {
      return cat === "spongebob" ? "photos/" + label + ".png" : "statues_photos/" + label + ".png";
    }

    // Show room code
    document.getElementById("roomCodeDisplay").textContent = ROOM;
    document.getElementById("waitCode").textContent = ROOM;
    document.getElementById("waitUrl").textContent =
      window.location.origin + window.location.pathname.replace("tabu-anlatici.html", "tabu-tahminci.html") + "?room=" + ROOM;

    let lastLevel = -1;

    onValue(roomRef, snap => {
      if (!snap.exists()) return;
      const room = snap.val();

      if (room.status === "waiting") {
        document.getElementById("waitingScreen").style.display = "flex";
        document.getElementById("playScreen").style.display    = "none";
        document.getElementById("finishedScreen").style.display = "none";
        return;
      }

      if (room.status === "finished") {
        document.getElementById("waitingScreen").style.display  = "none";
        document.getElementById("playScreen").style.display     = "none";
        document.getElementById("finishedScreen").style.display = "flex";
        document.getElementById("finalScore").textContent = room.score || 0;
        document.getElementById("finalTotal").textContent = "/" + room.queue.length;
        const dots = document.getElementById("anlaticiDots");
        dots.innerHTML = (room.results || []).map(r =>
          '<span class="guess-progress-dot is-' + r + '"></span>'
        ).join("");
        return;
      }

      // Playing
      document.getElementById("waitingScreen").style.display  = "none";
      document.getElementById("playScreen").style.display     = "grid";
      document.getElementById("finishedScreen").style.display = "none";

      const queue   = room.queue || [];
      const level   = room.current_level || 0;
      const results = room.results || [];
      const total   = queue.length;

      document.getElementById("anlaticiScore").textContent    = room.score || 0;
      document.getElementById("anlaticiLevelNum").textContent = level + 1;
      document.getElementById("anlaticiTotal").textContent    = total;

      // Progress dots
      const prog = document.getElementById("anlaticiProgress");
      prog.innerHTML =
        results.slice(0, total).map(r => '<span class="guess-progress-dot' + (r ? " is-" + r : "") + '"></span>').join("") +
        Array(Math.max(0, total - results.length)).fill('<span class="guess-progress-dot"></span>').join("");

      if (level !== lastLevel && level < total) {
        lastLevel = level;
        const item = queue[level];
        document.getElementById("anlaticiTargetImage").src           = photoPath(item.cat, item.label);
        document.getElementById("anlaticiLabelBar").style.display    = "flex";
        document.getElementById("anlaticiMemeLabel").textContent     = item.label.replace(/_/g, " ");
        document.getElementById("anlaticiCatTag").textContent        = item.cat === "spongebob" ? "Bob L'éponge" : t("cat_statues");
        document.getElementById("anlaticiLevelTitle").textContent    = t("level_prefix") + (level + 1);
      }

      // Status from guesser
      const status = room.guesser_status || "";
      const statusEl = document.getElementById("anlaticiStatus");
      if (status === "matched") {
        statusEl.textContent = t("status_matched");
        statusEl.className   = "tabu-status-bar status-ok";
      } else if (status === "trying") {
        statusEl.textContent = t("status_trying");
        statusEl.className   = "tabu-status-bar status-trying";
      } else {
        statusEl.textContent = t("status_waiting");
        statusEl.className   = "tabu-status-bar";
      }
    });

    // Skip button
    document.getElementById("skipAnlatici").addEventListener("click", async () => {
      const snap  = await get(roomRef);
      if (!snap.exists()) return;
      const room  = snap.val();
      const level = room.current_level || 0;
      const queue = room.queue || [];
      const results = room.results || [];
      results[level] = "skipped";

      if (level + 1 >= queue.length) {
        await update(roomRef, { status: "finished", results });
      } else {
        await update(roomRef, {
          current_level:  level + 1,
          guesser_status: "",
          results,
        });
      }
    });
  </script>
</body>
</html>
